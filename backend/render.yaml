services:
  - type: web
    name: alitransfers-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        scope: run
        value: # Add your Gemini API key in the Render dashboard
      - key: CORS_ORIGINS
        scope: run
        value: https://www.alitransfers.com,https://alitransfers.com,http://127.0.0.1:5500,http://localhost:5500
      - key: PYTHON_VERSION
        scope: build
        value: 3.11
